services:
  makelaar-scraper:
    image: ghcr.io/francisbehnen/makelaar-web-scraper:main
    container_name: makelaar-scraper
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS}
    volumes:
      - scraper-data:/app/data

  scraper-sidecar:
    image: ghcr.io/francisbehnen/makelaar-web-scraper-sidecar:main
    container_name: scraper-sidecar
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS}
      - TELEGRAM_ALERT_CHAT_IDS=${TELEGRAM_ALERT_CHAT_IDS:-}
      - DB_PATH=data/db.sqlite
      - CHECK_INTERVAL=300
      - DEBUG_DUMP=false
    volumes:
      - scraper-data:/app/data

volumes:
  scraper-data:
