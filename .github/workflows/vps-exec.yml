name: VPS command dispatcher

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        type: choice
        options:
          - docker-ps
          - docker-logs-sidecar
          - docker-logs-main
          - docker-logs-responder
          - docker-logs-errors
          - docker-stats
          - docker-restart-sidecar
          - docker-restart-main
          - docker-restart-both
          - docker-restart-responder
          - responder-rebuild
          - docker-compose-config
          - scraper-cycle-status
          - scraper-db-stats
          - scraper-last-new
          - responder-detection-stats
          - debug-huurstunt-locked
          - debug-huurstunt-login
          - watchtower-logs
          - system-disk
          - system-memory
          - system-uptime
          - system-processes
      lines:
        description: "Number of log lines (for log operations)"
        required: false
        default: "50"

jobs:
  exec:
    runs-on: ubuntu-latest
    steps:
      - name: Run operation
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          envs: OP,LINES
          script: |
            case "${OP}" in

              docker-ps)
                sudo docker ps -a --filter "name=makelaar-scraper" --filter "name=scraper-sidecar" --filter "name=scraper-responder" --filter "name=watchtower" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}"
                ;;

              docker-logs-sidecar)
                sudo docker logs --tail "${LINES:-50}" scraper-sidecar 2>&1
                ;;

              docker-logs-main)
                sudo docker logs --tail "${LINES:-50}" makelaar-scraper 2>&1
                ;;

              docker-logs-responder)
                sudo docker logs --tail "${LINES:-50}" scraper-responder 2>&1
                ;;

              docker-logs-errors)
                echo "=== Sidecar Errors ==="
                sudo docker logs --tail "${LINES:-200}" scraper-sidecar 2>&1 | grep -iE "error|fatal|crash|panic|timed out|timeout|traceback|warning" || echo "No errors found"
                echo ""
                echo "=== Main Scraper Errors ==="
                sudo docker logs --tail "${LINES:-200}" makelaar-scraper 2>&1 | grep -iE "error|fatal|crash|panic" || echo "No errors found"
                echo ""
                echo "=== Responder Errors ==="
                sudo docker logs --tail "${LINES:-200}" scraper-responder 2>&1 | grep -iE "error|fatal|crash|panic|thread.*died|traceback" || echo "No errors found"
                ;;

              docker-stats)
                sudo docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}" makelaar-scraper scraper-sidecar scraper-responder
                ;;

              docker-restart-sidecar)
                sudo docker restart scraper-sidecar
                sleep 20
                sudo docker ps -a --filter "name=scraper-sidecar" --format "table {{.Names}}\t{{.Status}}"
                echo ""
                sudo docker logs --tail 5 scraper-sidecar 2>&1
                ;;

              docker-restart-main)
                sudo docker restart makelaar-scraper
                sleep 20
                sudo docker ps -a --filter "name=makelaar-scraper" --format "table {{.Names}}\t{{.Status}}"
                echo ""
                sudo docker logs --tail 5 makelaar-scraper 2>&1
                ;;

              docker-restart-both)
                sudo docker restart scraper-sidecar makelaar-scraper scraper-responder
                sleep 20
                sudo docker ps -a --filter "name=makelaar-scraper" --filter "name=scraper-sidecar" --filter "name=scraper-responder" --format "table {{.Names}}\t{{.Status}}"
                ;;

              docker-restart-responder)
                sudo docker restart scraper-responder
                sleep 20
                sudo docker ps -a --filter "name=scraper-responder" --format "table {{.Names}}\t{{.Status}}"
                echo ""
                sudo docker logs --tail 5 scraper-responder 2>&1
                ;;

              responder-rebuild)
                COMPOSE=$(ls /docker/makelaar/docker-compose.yml /docker/makelaar-scraper/docker-compose.yml 2>/dev/null | head -1)
                if [ -z "$COMPOSE" ]; then
                  COMPOSE=$(find /docker -name "docker-compose.yml" -path "*makelaar*" 2>/dev/null | head -1)
                fi
                if [ -z "$COMPOSE" ]; then
                  echo "Compose file not found"
                  exit 1
                fi
                echo "Using compose file: $COMPOSE"
                cd "$(dirname "$COMPOSE")"
                sudo docker compose up -d --build scraper-responder
                sleep 20
                sudo docker ps -a --filter "name=scraper-responder" --format "table {{.Names}}\t{{.Status}}"
                echo ""
                sudo docker logs --tail 10 scraper-responder 2>&1
                ;;

              docker-compose-config)
                cat /docker/makelaar/docker-compose.yml 2>/dev/null || cat /docker/makelaar-scraper/docker-compose.yml 2>/dev/null || echo "Compose file not found — checking common paths..."
                find /docker -name "docker-compose.yml" -path "*makelaar*" 2>/dev/null
                ;;

              scraper-cycle-status)
                echo "=== Sidecar Last Cycle ==="
                sudo docker logs --tail 500 scraper-sidecar 2>&1 | grep -E "Cycle done|Starting scraper|timed out|scrape failed" | tail -10
                echo ""
                echo "=== Main Scraper Last Cycle ==="
                sudo docker logs --tail 200 makelaar-scraper 2>&1 | grep -E "^Done$|^Connected|Found [0-9]" | tail -10
                echo ""
                echo "=== Responder Status ==="
                sudo docker logs --tail 200 scraper-responder 2>&1 | grep -iE "starting|watcher|notified|thread.*died|duplicate" | tail -10
                ;;

              scraper-db-stats)
                sudo docker exec -i scraper-sidecar python3 << 'PYEOF'
            import sqlite3, os, sys
            db = os.environ.get("DB_PATH", "data/db.sqlite")
            if not os.path.isfile(db):
                print("Database not found at " + db); sys.exit(1)
            c = sqlite3.connect(db)
            total = c.execute("SELECT COUNT(*) FROM houses").fetchone()[0]
            resp = c.execute("SELECT name FROM sqlite_master WHERE type='table' AND name='responses'").fetchone()
            print("=== Database Stats ===")
            print(str(total) + " total listings in houses table")
            if resp:
                notified = c.execute("SELECT COUNT(*) FROM responses WHERE status != 'seeded'").fetchone()[0]
                print(str(notified) + " listings notified via responder")
            print()
            print("=== Last 10 Listings ===")
            rows = c.execute("SELECT straatnaamHuisnummer, plaats, vraagprijs, url FROM houses ORDER BY rowid DESC LIMIT 10").fetchall()
            if rows:
                print("{:<35} {:<15} {:<12} {}".format("Address", "City", "Price", "URL"))
                print("-"*80)
                for r in rows:
                    url = (r[3] or "")
                    if len(url) > 40:
                        url = url[:40] + "..."
                    print("{:<35} {:<15} {:<12} {}".format(r[0] or "", r[1] or "", r[2] or "", url))
            else:
                print("(no listings)")
            c.close()
            PYEOF
                ;;

              responder-detection-stats)
                sudo docker exec -i scraper-sidecar python3 << 'PYEOF'
            import sqlite3, os, sys
            db = os.environ.get("DB_PATH", "data/db.sqlite")
            if not os.path.isfile(db):
                print("Database not found at " + db); sys.exit(1)
            c = sqlite3.connect(db)
            has = c.execute("SELECT name FROM sqlite_master WHERE type='table' AND name='responses'").fetchone()
            if not has:
                print("responses table does not exist yet"); sys.exit(0)
            print("=== Contact method x status (all notified listings) ===")
            for r in c.execute("SELECT COALESCE(contact_method,'(none)') AS method, status, COUNT(*) AS n FROM responses WHERE status != 'seeded' GROUP BY method, status ORDER BY method, status"):
                print("  {:<15} {:<12} {}".format(r[0], r[1], r[2]))
            print()
            print("=== Per site (domain x method) ===")
            q = """
              WITH d AS (
                SELECT COALESCE(contact_method,'(none)') AS method, status,
                  CASE WHEN instr(h,'/')>0 THEN substr(h,1,instr(h,'/')-1) ELSE h END AS domain
                FROM (SELECT contact_method, status,
                        replace(replace(replace(url,'https://',''),'http://',''),'www.','') AS h
                      FROM responses WHERE status != 'seeded')
              )
              SELECT domain, method, status, COUNT(*) AS n
              FROM d GROUP BY domain, method, status ORDER BY domain, method
            """
            for r in c.execute(q):
                print("  {:<35} {:<15} {:<12} {}".format(r[0], r[1], r[2], r[3]))
            print()
            print("=== Forms that fell back to manual / failed (with reason) ===")
            for r in c.execute("SELECT substr(url,1,55), status, substr(COALESCE(error,''),1,70) FROM responses WHERE status IN ('manual','failed') ORDER BY updated_at DESC LIMIT 25"):
                print("  {:<55} {:<8} {}".format(r[0], r[1], r[2]))
            c.close()
            PYEOF
                ;;

              scraper-last-new)
                echo "=== Last New Listings Found ==="
                sudo docker logs --tail 2000 scraper-sidecar 2>&1 | grep -E "scraped, [1-9]+ new|[1-9]+ new across" | tail -20
                echo ""
                echo "=== Telegram Notifications Sent ==="
                sudo docker logs --tail 2000 scraper-sidecar 2>&1 | grep -iE "telegram|notification" | tail -10
                ;;

              responder-detection-stats)
                sudo docker exec -i scraper-sidecar python3 << 'PYEOF'
            import sqlite3, os, sys
            db = os.environ.get("DB_PATH", "data/db.sqlite")
            if not os.path.isfile(db):
                print("Database not found at " + db); sys.exit(1)
            c = sqlite3.connect(db)
            has = c.execute("SELECT name FROM sqlite_master WHERE type='table' AND name='responses'").fetchone()
            if not has:
                print("responses table does not exist yet"); sys.exit(0)
            print("=== Contact method x status (all notified listings) ===")
            for r in c.execute("SELECT COALESCE(contact_method,'(none)') AS method, status, COUNT(*) AS n FROM responses WHERE status != 'seeded' GROUP BY method, status ORDER BY method, status"):
                print("  {:<15} {:<12} {}".format(r[0], r[1], r[2]))
            print()
            print("=== Per site (domain x method) ===")
            q = """
              WITH d AS (
                SELECT COALESCE(contact_method,'(none)') AS method, status,
                  CASE WHEN instr(h,'/')>0 THEN substr(h,1,instr(h,'/')-1) ELSE h END AS domain
                FROM (SELECT contact_method, status,
                        replace(replace(replace(url,'https://',''),'http://',''),'www.','') AS h
                      FROM responses WHERE status != 'seeded')
              )
              SELECT domain, method, status, COUNT(*) AS n
              FROM d GROUP BY domain, method, status ORDER BY domain, method
            """
            for r in c.execute(q):
                print("  {:<35} {:<15} {:<12} {}".format(r[0], r[1], r[2], r[3]))
            print()
            print("=== Forms that fell back to manual / failed (with reason) ===")
            for r in c.execute("SELECT substr(url,1,55), status, substr(COALESCE(error,''),1,70) FROM responses WHERE status IN ('manual','failed') ORDER BY updated_at DESC LIMIT 25"):
                print("  {:<55} {:<8} {}".format(r[0], r[1], r[2]))
            c.close()
            PYEOF
                ;;

              debug-huurstunt-locked)
                sudo docker exec -i scraper-sidecar python3 << 'PYEOF'
            import scraper
            url = "https://www.huurstunt.nl/huren/delft"
            body = scraper._http_get(url)
            print("fetched bytes:", len(body))
            page = scraper.Adaptor(body.decode("utf-8", "replace"), url=url)
            all_articles = page.css("article")
            dl_articles = page.css("article[data-loading]")
            print("all <article>:", len(all_articles))
            print("article[data-loading]:", len(dl_articles))
            print("total a[href*='/huren/in/']:", len(page.css("a[href*='/huren/in/']")))
            print("total a[href*='/aanmelden']:", len(page.css("a[href*='/aanmelden']")))
            locked = []
            for a in all_articles:
                has_open = bool(a.css("a[href*='/huren/in/']"))
                has_lock = bool(a.css("a[href*='/aanmelden']"))
                if has_lock and not has_open:
                    locked.append(a)
            print("locked-only articles:", len(locked))
            if locked:
                a = locked[0]
                print("=== FIRST LOCKED CARD ATTRS ===")
                try:
                    print(dict(a.attrib))
                except Exception as e:
                    print("attrib err:", e)
                print("=== LINKS IN CARD ===")
                for ln in a.css("a"):
                    print("  href=", ln.attrib.get("href"), "| text=", (ln.get_all_text() or "").strip()[:60])
                print("=== TEXT ===")
                print((a.get_all_text() or "").strip()[:600])
                print("=== HTML (first 4000 chars) ===")
                try:
                    print(a.html_content[:4000])
                except Exception as e:
                    print("html err:", e)
            PYEOF
                ;;

              debug-huurstunt-login)
                sudo docker exec -i scraper-sidecar python3 << 'PYEOF'
            import scraper
            for url in ("https://www.huurstunt.nl/inloggen", "https://www.huurstunt.nl/aanmelden", "https://www.huurstunt.nl/aanmelden?huis=f0cs6"):
                print("\n############ " + url + " ############")
                try:
                    body = scraper._http_get(url)
                except Exception as e:
                    print("fetch err:", repr(e)); continue
                print("bytes:", len(body))
                page = scraper.Adaptor(body.decode("utf-8", "replace"), url=url)
                forms = page.css("form")
                print("forms:", len(forms))
                for fi, f in enumerate(forms):
                    print("--- form", fi, "action=", f.attrib.get("action"), "method=", f.attrib.get("method"), "---")
                    for inp in f.css("input"):
                        at = dict(inp.attrib)
                        print("   input name=", at.get("name"), "type=", at.get("type"), "value=", (at.get("value") or "")[:40])
                    for btn in f.css("button"):
                        print("   button:", (btn.get_all_text() or "").strip()[:50], "type=", btn.attrib.get("type"))
                # surface any wording about password vs magic link / email-only
                txt = (page.get_all_text() or "")
                for kw in ("wachtwoord", "magic", "e-mail", "email", "verificatie", "inloglink", "link", "code"):
                    i = txt.lower().find(kw)
                    if i != -1:
                        print("   kw[%s]: ...%s..." % (kw, txt[max(0,i-40):i+60].replace(chr(10)," ").strip()))
            PYEOF
                ;;

              watchtower-logs)
                sudo docker logs --tail "${LINES:-20}" watchtower 2>&1
                ;;

              system-disk)
                df -h /
                echo ""
                echo "=== Docker disk usage ==="
                sudo docker system df
                ;;

              system-memory)
                free -h
                ;;

              system-uptime)
                uptime
                ;;

              system-processes)
                echo "=== Top 15 by memory ==="
                ps aux --sort=-%mem | head -16
                ;;

              *)
                echo "Unknown operation: ${OP}"
                exit 1
                ;;
            esac
        env:
          OP: ${{ inputs.operation }}
          LINES: ${{ inputs.lines }}
