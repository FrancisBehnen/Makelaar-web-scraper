name: Scraper logs

on:
  workflow_dispatch:
    inputs:
      container:
        description: Which container
        required: true
        type: choice
        options:
          - scraper-sidecar
          - makelaar-scraper
        default: scraper-sidecar
      lines:
        description: Number of log lines
        required: false
        default: "50"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          envs: CONTAINER,LOG_LINES
          script: |
            sudo docker logs --tail "${LOG_LINES:-50}" "${CONTAINER:-scraper-sidecar}" 2>&1
        env:
          CONTAINER: ${{ inputs.container }}
          LOG_LINES: ${{ inputs.lines }}
